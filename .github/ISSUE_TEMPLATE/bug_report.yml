name: Bug Report
description: Report a bug or unexpected behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Configure client with...
        2. Call Login()...
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`
      placeholder: "go1.26.5 linux/amd64"
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: The version of go-pkceflow you are using.
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - iOS
        - Android
        - Other
    validations:
      required: true
  - type: dropdown
    id: idp
    attributes:
      label: Identity provider
      description: Which IdP are you using?
      options:
        - Keycloak
        - Microsoft Entra ID
        - Auth0
        - Okta
        - Google
        - Other
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Copy and paste any relevant log output. Ensure no tokens or secrets are included.
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context about the problem (screenshots, related issues, etc.).
    validations:
      required: false
