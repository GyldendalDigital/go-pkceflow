name: Feature Request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you have considered.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      description: Which part of the library does this relate to?
      options:
        - Core (pkceflow)
        - Desktop flow handler (desktopflow)
        - Mobile flow handler (mobileflow)
        - Token persistence (keyringstore/filestore)
        - Event bus (eventbus)
        - Test infrastructure (oidctest)
        - Wails wrapper (wails-pkceflow)
        - Documentation
        - Other
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, examples, or references.
    validations:
      required: false
