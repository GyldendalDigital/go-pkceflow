name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux race and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all-packages
          path: coverage.out
          if-no-files-found: error

      - name: Test coverage checker
        run: go test ./.github/scripts/coveragecheck

      - name: Enforce coverage policy
        run: go run ./.github/scripts/coveragecheck -profile coverage.out

  cross-test:
    name: Cross-platform test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run tests
        run: go test ./...

      # Temporary #64 proof: remove after the required Test aggregate is
      # observed failing with only this Windows matrix leg red.
      - name: Demonstrate aggregate failure propagation
        if: github.event_name == 'pull_request' && github.head_ref == 'ci/required-matrix-aggregation' && matrix.os == 'windows-latest'
        run: exit 1

  test:
    name: Test
    if: ${{ always() }}
    needs: [test-linux, cross-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful test workers
        env:
          LINUX_RESULT: ${{ needs['test-linux'].result }}
          MATRIX_RESULT: ${{ needs['cross-test'].result }}
        shell: bash
        run: |
          echo "Linux race and coverage: $LINUX_RESULT"
          echo "Cross-platform test matrix: $MATRIX_RESULT"
          if [ "$LINUX_RESULT" != "success" ] || [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::One or more required test workers did not succeed"
            exit 1
          fi

  build-linux:
    name: Linux build and module hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  cross-build:
    name: Cross-platform build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      # Temporary #64 proof: remove after the required Build aggregate is
      # observed failing with only this Windows matrix leg red.
      - name: Demonstrate aggregate failure propagation
        if: github.event_name == 'pull_request' && github.head_ref == 'ci/required-matrix-aggregation' && matrix.os == 'windows-latest'
        run: exit 1

  build:
    name: Build
    if: ${{ always() }}
    needs: [build-linux, cross-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build workers
        env:
          LINUX_RESULT: ${{ needs['build-linux'].result }}
          MATRIX_RESULT: ${{ needs['cross-build'].result }}
        shell: bash
        run: |
          echo "Linux build and module hygiene: $LINUX_RESULT"
          echo "Cross-platform build matrix: $MATRIX_RESULT"
          if [ "$LINUX_RESULT" != "success" ] || [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::One or more required build workers did not succeed"
            exit 1
          fi

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-input: stable
          go-package: ./...
